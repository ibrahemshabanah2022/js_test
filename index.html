<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>تعديل ملف HTML</title>

    <style>
      body {
        font-family: Arial;
        padding: 30px;
      }

      input {
        padding: 10px;
        margin: 5px;
      }

      button {
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
      }

      table {
        margin-top: 20px;
        border-collapse: collapse;
        width: 400px;
      }

      th,
      td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <h2>تعديل بيانات HTML</h2>

    <button onclick="chooseFile()">اختيار ملف HTML</button>

    <br /><br />

    <input type="text" id="name" placeholder="الاسم" />

    <input type="number" id="age" placeholder="العمر" />

    <button onclick="saveData()">حفظ</button>

    <div id="message"></div>

    <script>
      // هنا سنحفظ الملف الذي اختاره المستخدم
      let fileHandle = null;

      // اختيار ملف HTML
      async function chooseFile() {
        try {
          fileHandle = await window.showOpenFilePicker({
            types: [
              {
                description: "HTML Files",
                accept: {
                  "text/html": [".html"],
                },
              },
            ],
            multiple: false,
          });

          fileHandle = fileHandle[0];

          document.getElementById("message").textContent =
            "تم اختيار الملف بنجاح";
        } catch (error) {
          console.log(error);
        }
      }

      // حفظ البيانات داخل الملف
      async function saveData() {
        if (!fileHandle) {
          alert("اختار ملف HTML أولاً");

          return;
        }

        let name = document.getElementById("name").value;

        let age = document.getElementById("age").value;

        if (name === "" || age === "") {
          alert("اكتب الاسم والعمر");

          return;
        }

        // محتوى HTML الجديد
        let html = `
<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>بيانات المستخدم</title>

</head>

<body>

    <h1>بيانات المستخدم</h1>

    <table border="1">

        <tr>
            <th>الاسم</th>
            <th>العمر</th>
        </tr>

        <tr>
            <td>${name}</td>
            <td>${age}</td>
        </tr>

    </table>

</body>

</html>
`;

        // فتح الملف للكتابة
        const writable = await fileHandle.createWritable();

        // كتابة HTML الجديد
        await writable.write(html);

        // إغلاق الملف وحفظه
        await writable.close();

        document.getElementById("message").textContent =
          "تم حفظ البيانات داخل ملف HTML بنجاح";

        // تفريغ الحقول
        document.getElementById("name").value = "";

        document.getElementById("age").value = "";
      }
    </script>
  </body>
</html>
