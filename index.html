<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تعديل بيانات GitHub</title>

    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 40px auto;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>إدارة البيانات</h1>

    <input
        type="text"
        id="name"
        placeholder="الاسم"
    >

    <input
        type="number"
        id="age"
        placeholder="العمر"
    >

    <button onclick="addData()">
        إضافة
    </button>

    <button onclick="saveToGitHub()">
        حفظ على GitHub
    </button>

    <div id="message"></div>

    <table>

        <thead>
            <tr>
                <th>الاسم</th>
                <th>العمر</th>
                <th>حذف</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>


<script>

// =====================================
// إعدادات GitHub
// =====================================

const GITHUB_USERNAME = "YOUR_USERNAME";

const GITHUB_REPOSITORY = "YOUR_REPOSITORY";

const FILE_PATH = "data.html";

const BRANCH = "main";

// لا تضع Token هنا في موقع عام
const GITHUB_TOKEN = "YOUR_TOKEN";


// =====================================
// البيانات
// =====================================

let data = [];

let fileSHA = null;


// =====================================
// عند فتح الصفحة
// =====================================

window.onload = function () {

    loadFromGitHub();

};


// =====================================
// قراءة data.html من GitHub
// =====================================

async function loadFromGitHub() {

    try {

        const url =
            `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPOSITORY}/contents/${FILE_PATH}?ref=${BRANCH}`;

        const response = await fetch(url, {

            headers: {
                "Accept": "application/vnd.github+json"
            }

        });


        if (!response.ok) {

            throw new Error("فشل تحميل الملف");

        }


        const result = await response.json();


        // نحتاج SHA عند تحديث الملف
        fileSHA = result.sha;


        // تحويل Base64 إلى HTML
        const html =
            decodeURIComponent(
                escape(
                    atob(result.content.replace(/\n/g, ""))
                )
            );


        // استخراج البيانات من HTML
        const parser = new DOMParser();

        const doc =
            parser.parseFromString(html, "text/html");


        const rows =
            doc.querySelectorAll("#dataTable tbody tr");


        data = [];


        rows.forEach(row => {

            const cells = row.querySelectorAll("td");


            if (cells.length >= 2) {

                data.push({

                    name: cells[0].textContent,

                    age: cells[1].textContent

                });

            }

        });


        displayData();


        showMessage("تم تحميل البيانات من GitHub");


    } catch (error) {

        console.error(error);

        showMessage("حدث خطأ أثناء تحميل البيانات");

    }

}


// =====================================
// إضافة بيانات
// =====================================

function addData() {

    const name =
        document.getElementById("name").value.trim();

    const age =
        document.getElementById("age").value.trim();


    if (!name || !age) {

        alert("اكتب الاسم والعمر");

        return;

    }


    data.push({

        name: name,

        age: age

    });


    displayData();


    document.getElementById("name").value = "";

    document.getElementById("age").value = "";

}


// =====================================
// عرض البيانات
// =====================================

function displayData() {

    const tableBody =
        document.getElementById("tableBody");


    tableBody.innerHTML = "";


    data.forEach((person, index) => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${escapeHTML(person.name)}</td>

            <td>${escapeHTML(person.age)}</td>

            <td>
                <button onclick="deleteData(${index})">
                    حذف
                </button>
            </td>

        `;


        tableBody.appendChild(row);

    });

}


// =====================================
// حذف بيانات
// =====================================

function deleteData(index) {

    data.splice(index, 1);

    displayData();

}


// =====================================
// إنشاء محتوى data.html
// =====================================

function createHTML() {

    let rows = "";


    data.forEach(person => {

        rows += `

            <tr>

                <td>${escapeHTML(person.name)}</td>

                <td>${escapeHTML(person.age)}</td>

            </tr>

        `;

    });


    return `

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>البيانات</title>

</head>

<body>

    <h1>بيانات المستخدمين</h1>

    <table border="1" id="dataTable">

        <thead>

            <tr>

                <th>الاسم</th>

                <th>العمر</th>

            </tr>

        </thead>

        <tbody>

            ${rows}

        </tbody>

    </table>

</body>

</html>

`;

}


// =====================================
// حفظ الملف على GitHub
// =====================================

async function saveToGitHub() {

    if (!fileSHA) {

        alert("لم يتم تحميل الملف أولاً");

        return;

    }


    if (
        GITHUB_TOKEN === "YOUR_TOKEN"
    ) {

        alert("ضع GitHub Token أولاً");

        return;

    }


    try {

        showMessage("جاري الحفظ...");


        const html =
            createHTML();


        // تحويل HTML إلى Base64
        const encodedContent =
            btoa(
                unescape(
                    encodeURIComponent(html)
                )
            );


        const url =
            `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPOSITORY}/contents/${FILE_PATH}`;


        const response =
            await fetch(url, {

                method: "PUT",

                headers: {

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        `Bearer ${GITHUB_TOKEN}`,

                    "X-GitHub-Api-Version":
                        "2022-11-28",

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    message:
                        "Update data.html",

                    content:
                        encodedContent,

                    sha:
                        fileSHA,

                    branch:
                        BRANCH

                })

            });


        const result =
            await response.json();


        if (!response.ok) {

            console.error(result);

            throw new Error(
                result.message ||
                "فشل الحفظ"
            );

        }


        // SHA الجديد
        fileSHA = result.content.sha;


        showMessage(
            "تم حفظ البيانات على GitHub بنجاح ✅"
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "حدث خطأ أثناء الحفظ: " +
            error.message
        );

    }

}


// =====================================
// حماية HTML
// =====================================

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


// =====================================
// رسالة
// =====================================

function showMessage(message) {

    document.getElementById("message").textContent =
        message;

}

</script>

</body>

</html>
